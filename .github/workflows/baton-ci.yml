name: baton-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: baton-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Tessaya's own checks on GitHub-hosted runners: upstream's ci.yml needs Blacksmith runners this repository does
# not have (D77). `verify` and `baton-ci` are the required check names.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Every shipped third-party piece has a notice
        run: |
          node scripts/tessaya/check-notices.mjs
          node --test scripts/tessaya/check-notices.test.mjs
          node --test scripts/tessaya/check-no-private-layer.test.mjs
      - name: Status-file writer
        run: node --test scripts/tessaya/status-file.test.mjs scripts/tessaya/cloud-logins.test.mjs scripts/tessaya/live/answer-review.test.mjs scripts/tessaya/live/baton-live-acp.test.mjs
      - name: Upstream paths equal PIN + series
        run: bash scripts/tessaya/patches.sh verify
      # After verify, which fetches the pin: the guard needs its tree to know which files are ours.
      - name: Nothing private ships by default
        run: node scripts/tessaya/guard-private.mjs
      - name: patches.sh self-test
        run: |
          git config --global user.email ci@baton.invalid
          git config --global user.name ci
          bash scripts/tessaya/patches.test.sh
          bash scripts/tessaya/tessaya-resume.test.sh

  baton-ci:
    name: baton-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci-deps

      - name: Typecheck (new errors fail; known ones sit in typecheck-baseline.txt)
        run: node scripts/tessaya/typecheck-gate.mjs

      - name: Lint (errors fail; it was not gated before and had drifted to 115)
        run: vp lint --report-unused-disable-directives

      - name: Unit tests of changed Baton files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" == 0000000* ]] || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          changed=$(git diff --name-only --diff-filter=d "$base"...HEAD 2>/dev/null || git diff --name-only --diff-filter=d "$base" HEAD)
          # An upstream sync changes hundreds of upstream test files; those are upstream's to run (they need browsers and
          # tools this runner does not have), so past this many only Baton's own tests are run.
          # A sync is known by its moved pin; a small one changes too few test files to be told apart by count.
          upstream_wave=0
          if echo "$changed" | grep -qx 'vendor-patches/t3code/PIN' || [ "$(echo "$changed" | grep -cE '\.test\.tsx?$' || true)" -gt 150 ]; then upstream_wave=1; echo "upstream sync: running Baton's own tests only"; fi
          # On main every test Tessaya added since the pin runs (web's too, not its browser ones), so a test no PR
          # touched cannot go stale until the nightly sync finds it. The pin's tree is fetched blobless to know which.
          all=0 workspaces="apps/server apps/desktop packages/tessaya-shared packages/tessaya-voice packages/tessaya-contracts"
          # Fetched for PRs too: the private guard's test needs the pin's tree whenever it runs.
          pin="$(tr -d '[:space:]' < vendor-patches/t3code/PIN)"
          git fetch -q --no-tags --filter=blob:none https://github.com/pingdotgg/t3code.git "$pin"
          if [ "${{ github.event_name }}" = push ]; then
            changed="$(git diff --no-renames --name-only --diff-filter=A "$pin" HEAD)" all=1 workspaces="$workspaces apps/web"
            echo "main: running every test Tessaya added since $pin"
          fi
          for ws in $workspaces; do
            pattern="^$ws/.*(baton|Baton).*\.test\.tsx?$|^$ws/.*\.test\.ts$"
            [ "$upstream_wave" -eq 1 ] && pattern="^$ws/.*(baton|Baton|Tessaya|Phone|Intent|WorkSession|Fleet).*\.test\.tsx?$"
            [ "$all" -eq 1 ] && pattern="^$ws/.*\.test\.tsx?$"
            files=$(echo "$changed" | grep -E "$pattern" | grep -vE '\.browser\.test\.' | sed "s|^$ws/||" || true)
            if [[ "$ws" == packages/tessaya-* ]]; then files=$(echo "$changed" | grep -E "^$ws/.*\.test\.ts$" | sed "s|^$ws/||" || true); fi
            [[ -z "$files" ]] && continue
            echo "== $ws: $(echo $files | wc -w) test files"
            (cd "$ws" && vp test run $files)
          done

      # The server crashed at start after a sync (a route registered twice) and no check ran the server. When the
      # server's own code or the patches change, build the Linux archive and run its CLI smoke test, as a release would.
      - name: Does the server start? (when the server or the patches changed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" == 0000000* ]] || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          # Not grep -q: it stops reading early, and under pipefail an import's long diff then reads as "nothing changed".
          if ! git diff --name-only "$base"...HEAD | grep -E '^(apps/server/src/|vendor-patches/|packages/tessaya-contracts/|apps/server/package.json)' > /dev/null; then
            echo "nothing the server runs changed; skipping"; exit 0
          fi
          rustup toolchain install stable --profile minimal > /dev/null 2>&1 || true
          cargo build --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/resource-monitor/linux-x64"
          cp native/resource-monitor/target/release/t3-resource-monitor "$RUNNER_TEMP/resource-monitor/linux-x64/"
          export BATON_RESOURCE_MONITOR_DIR="$RUNNER_TEMP/resource-monitor"
          NODE_ENV=production bash scripts/tessaya/release-build.sh 0.0.0-tessaya.0

      # Not a gate: the barge-in detector's measured numbers, printed whenever the voice package changes (docs/baton/BARGE_IN.md).
      - name: Barge-in detector, measured (report only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" == 0000000* ]] || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          if git diff --name-only "$base"...HEAD | grep -qE '^packages/tessaya-voice/src/(echo|core)'; then
            node scripts/tessaya/bargein-eval.ts 60 | tee "$RUNNER_TEMP/bargein.txt"
            cat "$RUNNER_TEMP/bargein.txt" >> "$GITHUB_STEP_SUMMARY"
          else echo "voice core and echo guard unchanged; skipping"; fi
