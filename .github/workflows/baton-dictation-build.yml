name: Tessaya dictation build

# Builds the sidecar on its own for every platform, so it can be tried without a desktop release. Windows is the
# one the app shipped with; Linux x64 and macOS arm64 + x64 are built and tested here the same way.
on:
  push:
    branches: [main]
    paths:
      [
        "native/baton-dictation/**",
        "native/tessaya-recognizer/**",
        ".github/workflows/baton-dictation-build.yml",
      ]
  pull_request:
    paths:
      [
        "native/baton-dictation/**",
        "native/tessaya-recognizer/**",
        ".github/workflows/baton-dictation-build.yml",
      ]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # The graphics-card build (gpu.rs) needs the Vulkan SDK's headers and shader compiler.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.1
          install_runtime: false
          cache: true
      - name: Build
        shell: bash
        env:
          # Portable AVX2 floor: the runner's own CPU may be newer than the laptop's i7-8550U. One CPU module, not ggml's
          # per-ISA set.
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_CPU_ALL_VARIANTS=OFF
        run: |
          sdk="$(cygpath -m "$VULKAN_SDK")"
          export TRANSCRIBE_CMAKE_ARGS="$TRANSCRIBE_CMAKE_ARGS -DCMAKE_PREFIX_PATH=$sdk"
          # Nothing installs the VC++ redistributable, so neither the exe nor its modules may need it.
          export RUSTFLAGS="-C target-feature=+crt-static -L native=$sdk/Lib"
          cargo test --release --locked --features gpu --manifest-path native/baton-dictation/Cargo.toml
          cargo build --release --locked --features gpu --manifest-path native/baton-dictation/Cargo.toml
          cd native/baton-dictation/target/release
          for f in tessaya-voice.exe transcribe.dll ggml.dll ggml-base.dll ggml-cpu.dll ggml-vulkan.dll; do
            test -f "$f" || { echo "$f missing" >&2; exit 1; }
            if grep -aqiE 'MSVCP140|VCRUNTIME140' "$f"; then
              echo "$f imports the VC++ runtime" >&2
              exit 1
            fi
          done
      - name: Starts and recognises on a PC with no Vulkan driver (this runner)
        shell: pwsh
        run: |
          if (Test-Path C:\Windows\System32\vulkan-1.dll) { Rename-Item C:\Windows\System32\vulkan-1.dll vulkan-1.dll.off }
          $exe = "native/baton-dictation/target/release/tessaya-voice.exe"
          $out = '{"cmd":"quit"}' | & $exe serve --gpu auto
          if ($LASTEXITCODE -ne 0 -or -not ($out -match '"ev":"ready"')) { "the sidecar did not start"; exit 1 }
          curl.exe -sSLf -o tdt.gguf "https://huggingface.co/handy-computer/parakeet-tdt-0.6b-v3-gguf/resolve/85ac09ea12fc4b1112fa76810059364bc6adc9de/parakeet-tdt-0.6b-v3-Q8_0.gguf"
          python -c "import wave,math,struct; w=wave.open('tone.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b''.join(struct.pack('<h', int(3000*math.sin(i/9))) for i in range(32000))); w.close()"
          $lines = & $exe transcribe --gpu auto --model tdt.gguf tone.wav
          $lines
          if ($LASTEXITCODE -ne 0 -or ($lines -match '"error"')) { "the CPU did not recognise"; exit 1 }
      - name: Windows names the process Tessaya
        shell: pwsh
        run: |
          $v = (Get-Item native/baton-dictation/target/release/tessaya-voice.exe).VersionInfo
          $v | Format-List FileDescription, ProductName, CompanyName, FileVersion
          if ($v.FileDescription -ne 'Tessaya voice' -or $v.ProductName -ne 'Tessaya') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: baton-dictation-win-x64
          path: |
            native/baton-dictation/target/release/tessaya-voice.exe
            native/baton-dictation/target/release/*.dll
            native/baton-dictation/Cargo.lock

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (audio, keyboard, clang for bindgen)
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libx11-dev libxi-dev libxtst-dev libxdo-dev libxkbcommon-dev libevdev-dev libclang-dev pkg-config
      - name: Test and build
        env:
          # Portable AVX2 floor, as on Windows: the runner's CPU may be newer than the user's.
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
        run: |
          cargo test --release --locked --manifest-path native/baton-dictation/Cargo.toml
          cargo build --release --locked --manifest-path native/baton-dictation/Cargo.toml
          ldd native/baton-dictation/target/release/tessaya-voice | tee ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: baton-dictation-linux-x64
          path: |
            native/baton-dictation/target/release/tessaya-voice
            ldd.txt

  recognizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the recogniser service
        env:
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
        run: |
          cargo test --release --locked --manifest-path native/tessaya-recognizer/Cargo.toml
          cargo build --release --locked --examples --manifest-path native/tessaya-recognizer/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: tessaya-recognizer-linux-x64
          path: |
            native/tessaya-recognizer/target/release/tessaya-recognizer
            native/tessaya-recognizer/target/release/examples/replay

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            cmake: -DGGML_NATIVE=OFF -DCMAKE_OSX_ARCHITECTURES=arm64
          - arch: x64
            target: x86_64-apple-darwin
            cmake: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DCMAKE_OSX_ARCHITECTURES=x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (tests run for the native arm64 build)
        env:
          TRANSCRIBE_CMAKE_ARGS: ${{ matrix.cmake }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          if [ "${{ matrix.arch }}" = arm64 ]; then cargo test --release --locked --manifest-path native/baton-dictation/Cargo.toml --target ${{ matrix.target }}; fi
          cargo build --release --locked --manifest-path native/baton-dictation/Cargo.toml --target ${{ matrix.target }}
          otool -L native/baton-dictation/target/${{ matrix.target }}/release/tessaya-voice | tee otool.txt
      - uses: actions/upload-artifact@v4
        with:
          name: baton-dictation-macos-${{ matrix.arch }}
          path: |
            native/baton-dictation/target/${{ matrix.target }}/release/tessaya-voice
            otool.txt
