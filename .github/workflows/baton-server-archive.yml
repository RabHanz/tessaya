name: Tessaya server archive

# Builds the Linux CLI/server archive a box runs (scripts/tessaya/release-build.sh) on a GitHub runner,
# so deploys need no local build. Published as a prerelease on tag server-<version>: never "Latest",
# so it cannot shadow the desktop release feed the updater reads. Fetch with scripts/tessaya/fetch-server-archive.sh.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Server version, e.g. 0.1.5-tessaya.1 (tag server-<version> is created at the dispatched commit)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: baton-server-archive-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version
        run: |
          # -baton.N is the old suffix, still accepted so an older build can be rebuilt.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(tessaya|baton)\.[0-9]+$ ]] || { echo "Version must look like 0.1.5-tessaya.1, got: $VERSION" >&2; exit 1; }

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build resource monitor
        run: |
          cargo build --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/resource-monitor/linux-x64"
          cp native/resource-monitor/target/release/t3-resource-monitor "$RUNNER_TEMP/resource-monitor/linux-x64/"
          echo "BATON_RESOURCE_MONITOR_DIR=$RUNNER_TEMP/resource-monitor" >> "$GITHUB_ENV"

      - name: Build the R1 voice loop's recogniser
        env:
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
        run: |
          cargo build --release --locked --manifest-path native/tessaya-recognizer/Cargo.toml
          echo "BATON_R1_RECOGNIZER=$PWD/native/tessaya-recognizer/target/release/tessaya-recognizer" >> "$GITHUB_ENV"

      - name: Build and smoke-test the archive
        run: NODE_ENV=production bash scripts/tessaya/release-build.sh "$VERSION"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-cli
          sha256sum "t3-$VERSION-linux-x64.tar.gz" > "t3-$VERSION-linux-x64.tar.gz.sha256"
          # The R1 voice bundle beside it: the server built above fetches it by the pinned sha256.
          gh release create "server-$VERSION" "t3-$VERSION-linux-x64.tar.gz" "t3-$VERSION-linux-x64.tar.gz.sha256" \
            "r1-voice-$VERSION-linux-x64.tar.gz" "r1-voice-$VERSION-linux-x64.tar.gz.sha256" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Server $VERSION" \
            --notes "Linux server archive built from $GITHUB_SHA. The r1-voice bundle and the models it fetches include Parakeet TDT 0.6B v3 by NVIDIA (CC BY 4.0, https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3), Pocket TTS by Kyutai (CC BY 4.0) and Smart Turn by Daily (BSD-2-Clause); see docs/baton/THIRD_PARTY_NOTICES.md."
