name: tessel-flash

# Releases are built and published by tessel-flash.yml in RabHanz/tessaya-releases.

on:
  pull_request:
    paths: ["tools/tessel-flash/**", ".github/workflows/tessel-flash.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/tessel-flash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tessel-flash/go.mod
          cache-dependency-path: tools/tessel-flash/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      # The protocol core stays usable from a browser (Web Serial) later.
      - name: Core builds for WebAssembly
        run: GOOS=js GOARCH=wasm go build ./core/...
