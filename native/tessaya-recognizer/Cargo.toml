[package]
name = "tessaya-recognizer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tessaya's dictation recogniser as a service: his audio streamed in while the key is held, words back."

[[bin]]
name = "tessaya-recognizer"
path = "src/main.rs"

[dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false }
tungstenite = "0.27"
serde_json = "1"
hound = "3.5.1"

[profile.release]
lto = "thin"
